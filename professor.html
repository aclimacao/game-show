<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tribunal Técnico · Professor</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#3B1C8C;--y:#FFC400;--g:#2ECC71;--ink:#1d1140;--g1:linear-gradient(#ffffff0b 1px,transparent 1px);--g2:linear-gradient(90deg,#ffffff0b 1px,transparent 1px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font:500 1.3rem/1.35 Fredoka,system-ui,sans-serif;background:var(--g1) 0 0/36px 36px,var(--g2) 0 0/36px 36px,radial-gradient(circle at 15% 10%,#5b2fd0 0,transparent 45%),radial-gradient(circle at 90% 90%,#7a2bc4 0,transparent 40%),var(--bg);background-attachment:fixed}
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;gap:1rem}
.tag{background:#ffffff26;border-radius:99px;padding:.3rem 1.1rem;font-size:1.1rem}
#tm{position:relative;isolation:isolate;display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--rc,var(--y)) var(--p,0%),#ffffff33 0);color:#fff;font-size:2.4rem;font-weight:700}
#tm::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#2a1370;z-index:-1}
#tm.u{--rc:#FF4D6D;animation:p .5s infinite alternate}@keyframes p{to{transform:scale(1.12)}}
main{padding:0 2rem 1rem;max-width:1300px;margin:0 auto}
.q{background:#fff;color:var(--ink);border-radius:22px;padding:1.6rem 2.2rem;font-size:2.3rem;line-height:1.25;font-weight:700;box-shadow:0 8px 0 #0003;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
.o{display:flex;align-items:center;gap:1rem;border-radius:16px;padding:1.2rem 1.5rem;font-size:1.9rem;font-weight:700;box-shadow:0 6px 0 #0003}
.o s{text-decoration:none;font-size:2.2rem}.o{position:relative}.o.x{opacity:.28}.o .pc2{margin-left:auto;font-size:1.3rem;background:#0003;border-radius:99px;padding:.1rem .8rem;white-space:nowrap}.lvl{display:inline-flex;gap:.4rem;align-items:center;border:2px solid;border-radius:99px;padding:.1rem .8rem;font-size:1rem;margin:.2rem}.o.w{outline:6px solid #fff;transform:scale(1.03)}
.ex{background:#ffffff1f;border-radius:16px;padding:1rem 1.5rem;margin-top:1rem;font-size:1.3rem}
.ex code{display:block;margin-top:.5rem;color:var(--y);font-family:Consolas,monospace;font-size:1.1rem}
.big{text-align:center;font-size:3.6rem;font-weight:700;margin:.5rem 0}
.pls{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1rem}.pl{background:#ffffff22;border:3px solid;border-radius:99px;padding:.2rem .9rem;font-size:1.15rem;display:inline-flex;align-items:center;gap:.4rem}
.av{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;font-size:1.1rem}
.rk{display:grid;grid-template-columns:230px 1fr 80px;gap:.8rem;align-items:center;margin:.55rem 0;font-size:1.5rem}
.rk i{display:block;height:34px;border-radius:10px;transition:width .8s}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:1rem;margin:1rem 0}.pc{width:200px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:.8rem;color:var(--ink);font-weight:700;font-size:1.5rem}.pc b{font-size:2.6rem}.pc small{font-size:1.3rem}
.ft{display:flex;gap:1rem;align-items:center;padding:0 2rem 2rem;max-width:1300px;margin:0 auto}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:.8rem 1.8rem;cursor:pointer;background:var(--g);color:var(--ink);box-shadow:0 5px 0 #1b8a4c;font-size:1.4rem}
button.s{background:#ffffff26;color:#fff;box-shadow:none;font-size:1rem;padding:.4rem .9rem}
.tp{display:inline-block;background:#ffffff22;border-radius:99px;padding:.2rem 1rem;margin:.2rem}
button:focus-visible{outline:4px solid #fff}
</style></head><body>
<header><span class="tag" id="info">Tribunal Técnico</span><span class="tag" id="fase"></span><button class="s" id="snd">🔇 Som</button><div id="tm"></div></header>
<main id="m"></main>
<div class="ft"><button id="go">Avançar</button><span style="opacity:.7;font-size:1rem">Espaço avança · R ranking · M som</span><button class="s" id="rkb">🏆 Ranking (R)</button><button class="s" id="rc">Recarregar casos</button><button class="s" id="rs">Zerar sala</button></div>
<script>
const U="https://script.google.com/macros/s/AKfycbzNLVVfJC4cpRJ-yR8Ckv4MdK7sWLS7ceULoXpdeKM9OcfF2kFyQMpWMbAa5yZLnkPv/exec";
const T={leitura:25,final:20};   /* em segundos; final igual a FIN no Code.gs */
/* níveis: prefixo (sem acento) · cor · ícone · nome · segundos de discussão · multiplicador de pontos */
const LV=[["aquec","#2ECC71","🟢","Aquecimento",45,1],["tec","#2D9CFF","🔵","Técnico",60,1.5],["peri","#FF4D6D","🔴","Perícia",90,2]];
const lv=t=>{const s=String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();return LV.find(x=>s.startsWith(x[0]))||["","#C084FC","⚪",String(t||""),60,1]};
const CO=["#2D9CFF","#FF4D6D","#FFC400","#2ECC71"],SH="▲◆●■";
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* ---------- som (sintetizado, sem arquivos) ---------- */
let AC=null,armed=false,mute=false,mus=null,cur=null,st0=0;
const au=()=>{if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state==="suspended")AC.resume();return AC};
function tone(f,d=.15,t="sine",v=.12,at=0){const a=armed&&!mute&&au();if(!a)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+at;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}
const seq=(a,t="triangle")=>a.forEach((f,i)=>tone(f,.28,t,.14,i*.14));
const PAT={lobby:[262,330,392,330,262,330,392,523,294,349,440,349,294,349,440,587],play:[196,0,294,0,196,0,330,0,220,0,330,0,247,0,349,0]};
function music(k){cur=k;clearInterval(mus);mus=null;if(!k||!armed||mute)return;const p=PAT[k];st0=0;mus=setInterval(()=>{const f=p[st0++%p.length];if(f)tone(f,.2,k==="lobby"?"triangle":"square",.05)},k==="lobby"?230:190)}
function arm(){if(armed)return;armed=true;mute=false;au();$("snd").textContent="🔊 Som";music(cur)}
function toggle(){if(!armed){arm();return}mute=!mute;$("snd").textContent=mute?"🔇 Som":"🔊 Som";music(mute?null:cur);if(mute)clearInterval(mus)}
$("snd").onclick=toggle;addEventListener("pointerdown",arm,{once:true});
let pf=null;
function fx(f){if(f===pf)return;pf=f;
 if(f==="lobby"||f==="discussao")music("lobby");else if(f==="leitura")music("play");else{music(null);if(f==="revela")seq([392,523,659,784]);if(f==="fim")seq([523,659,784,1047,784,1047,1319])}}
/* ---------- dados ---------- */
let S={st:{fase:"lobby"},n:0,a:0,gs:{},top:[],pl:[],gr:[],dist:[0,0,0,0]},CASOS=[],off=0,busy=false,lr=-1,rk=false;
const PIN=sessionStorage.pin||(sessionStorage.pin=prompt("PIN do professor")||"");
const call=async b=>(await fetch(U,{method:"POST",body:JSON.stringify({...b,pin:PIN})})).json();
async function loadC(){try{const r=await(await fetch(U+"?a=c&fresh=1&pin="+encodeURIComponent(PIN))).json();if(r.err==="pin"){sessionStorage.removeItem("pin");alert("PIN incorreto")}CASOS=r.c||[];const bad=CASOS.map((c,i)=>(c.g<0||c.g>=c.o.length||c.o.length<2)?i+1:0).filter(Boolean);if(bad.length)alert("Revise a planilha: gabarito ou alternativas inválidos no(s) caso(s) nº "+bad.join(", ")+" (conte a partir da linha 2).");render()}catch(e){alert("Não consegui carregar os casos.")}}
async function poll(){try{const r=await(await fetch(U+"?a=p")).json();if(!busy){S=r;off=r.now-Date.now();render()}}catch(e){$("fase").textContent="Sem conexão…"}setTimeout(poll,2000)}
async function avancar(){
 arm();if(busy)return;rk=false;const st=S.st,f=st.fase||"lobby",i=st.caso??-1;let b;
 if(f==="lobby"||f==="revela"){const n=f==="lobby"?0:i+1;
  if(!CASOS.length)return alert("Nenhum caso na aba Casos da planilha.");
  if(n>=CASOS.length)b={a:"set",patch:{fase:"fim",rev:null,fimEm:0}};
  else{const c=CASOS[n];b={a:"set",patch:{caso:n,fase:"leitura",dur:T.leitura,rev:null,q:{t:c.t,m:c.m,q:c.q,o:c.o,n:n+1,tot:CASOS.length}}}}}
 else if(f==="leitura"){const c=CASOS[st.caso];b={a:"set",patch:{fase:"discussao",dur:c?lv(c.t)[4]:60}}}
 else if(f==="discussao")b={a:"set",patch:{fase:"final",dur:T.final}};
 else if(f==="final"){const c=CASOS[st.caso];if(!c)return alert("Casos não carregados. Clique em Recarregar casos.");b={a:"rev",g:c.g,e:c.e,w:c.w,m:lv(c.t)[5]}}
 else{render();return}
 busy=true;try{const r=await call(b);if(r.st){S.st=r.st;render()}else if(r.err==="pin"){sessionStorage.removeItem("pin");alert("PIN incorreto")}}finally{busy=false}render()}
$("go").onclick=()=>{$("go").blur();avancar()};$("rc").onclick=loadC;
$("rs").onclick=async()=>{if(confirm("Zerar alunos, pontos e respostas?")){await call({a:"reset"});S={st:{fase:"lobby"},n:0,a:0,gs:{},top:[],pl:[],gr:[],dist:[0,0,0,0]};rk=false;await loadC()}};
function togRk(){rk=!rk;render()}
$("rkb").onclick=()=>{$("rkb").blur();togRk()};
addEventListener("keydown",e=>{if(e.repeat)return;
 if(e.code==="Space"||e.code==="ArrowRight"){e.preventDefault();if(document.activeElement)document.activeElement.blur();avancar()}
 if(e.key==="m"||e.key==="M")toggle();if(e.key==="r"||e.key==="R")togRk()});
/* ---------- tela ---------- */
const G=i=>S.gr[i]||["?","#aaa","⭐"];
const rkA=()=>Object.entries(S.gs).map(([g,x])=>({g:+g,m:x.m,a:x.s/x.m})).sort((a,b)=>b.a-a.a);
function ranking(){const t=rkA(),mx=Math.max(1,...t.map(x=>x.a));
 return t.map((x,i)=>`<div class="rk"><span style="color:${G(x.g)[1]}">${i+1}º ${G(x.g)[2]} ${esc(G(x.g)[0])}</span><i style="width:${Math.max(3,x.a/mx*100)}%;background:${G(x.g)[1]}"></i><b>${Math.round(x.a)}</b></div>`).join("")||"<p>Sem pontos ainda.</p>"}
function podium(){const t=rkA();return `<div class="pod">${[1,0,2].map(i=>t[i]?`<div class="pc" style="height:${[270,210,160][i]}px;background:${G(t[i].g)[1]}"><b>${["🥇","🥈","🥉"][i]}</b>${G(t[i].g)[2]} ${esc(G(t[i].g)[0])}<small>${Math.round(t[i].a)} pts</small></div>`:"").join("")}</div>`}
function topHtml(){return (S.top||[]).length?`<p style="text-align:center;margin-top:1rem">${S.top.map((x,i)=>`<span class="tp">${["🥇","🥈","🥉"][i]} ${esc(x[0])} · ${x[1]}</span>`).join("")}</p>`:""}
function goLabel(f,st){
 if(f==="lobby"||f==="revela"){const n=f==="lobby"?0:(st.caso??-1)+1;
  if(!CASOS.length)return "Sem casos";
  if(n>=CASOS.length)return "Ver placar final";
  const a=lv(CASOS[n].t),b=n?lv(CASOS[n-1].t):null;
  return (!b||a[3]!==b[3])?`Iniciar ${a[2]} ${a[3]}`:"Próximo caso"}
 return {leitura:"Abrir discussão",discussao:"Abrir voto final",final:"Revelar",fim:"Fim"}[f]}
function render(){
 const st=S.st,f=st.fase||"lobby",q=st.q,rev=st.rev;let h="";fx(f);
 $("rkb").textContent=rk?"← Voltar (R)":"🏆 Ranking (R)";
 $("fase").textContent={lobby:"Sala aberta",leitura:"Leia e responda",discussao:"Hora de discutir!",final:"Voto final",revela:"Resultado",fim:"Fim"}[f];
 $("info").textContent=q&&f!=="lobby"?`${lv(q.t)[2]} ${q.t} · Caso ${q.n} de ${q.tot}${q.m?" · "+q.m:""}`:"Tribunal Técnico";
 if(rk&&f!=="fim"){h=`<div class="big">🏆 Ranking dos grupos</div>${podium()}${ranking()}${topHtml()}`}
 else if(f==="lobby"){const u=location.href.split("?")[0].replace("professor.html","aluno.html");
  h=`<div class="big">Tribunal Técnico</div><p style="text-align:center">Entre em <b style="color:var(--y)">${u}</b></p><p style="text-align:center;font-size:2rem"><b>${S.n}</b> no tribunal · ${CASOS.length} casos</p><p style="text-align:center">${LV.map(l=>{const c=CASOS.filter(x=>lv(x.t)[3]===l[3]).length;return c?`<span class="lvl" style="border-color:${l[1]}">${l[2]} ${l[3]} · ${c}</span>`:""}).join("")}</p>
  <div class="pls">${S.gr.map((g,i)=>`<span class="pl" style="border-color:${g[1]}">${g[2]} ${esc(g[0])} · ${(S.gs[i]||{m:0}).m}</span>`).join("")}</div>
  <div class="pls">${(S.pl||[]).map(([v,n,g,k])=>`<span class="pl" style="border-color:${G(g)[1]}"><span class="av" style="background:${k}">${esc(v)}</span>${esc(n)}</span>`).join("")}</div>`}
 else if(f==="fim"){h=`<div class="big">Placar final</div>${podium()}${ranking()}<p style="text-align:center;margin-top:1rem"></p>${topHtml()}`}
 else if(q){
  const tot=(S.dist||[]).reduce((a,b)=>a+b,0);
  h=`<div class="q">${esc(q.q)}</div><div class="opts">${q.o.map((o,i)=>`<div class="o ${rev?(i===rev.g?"w":"x"):""}" style="background:${CO[i]};color:${i==2?"#1d1140":"#fff"}"><s>${SH[i]}</s><span>${esc(o)}</span>${rev?`<span class="pc2">${S.dist[i]||0} (${tot?Math.round((S.dist[i]||0)/tot*100):0}%)</span>`:""}</div>`).join("")}</div>`;
  if(f==="leitura"||f==="final")h+=`<p style="text-align:center">${S.a} de ${S.n} responderam</p>`;
  if(f==="discussao")h+=`<p style="text-align:center;font-size:1.8rem">Converse com o grupo e convença os colegas.</p>`;
  if(rev)h+=`<p style="text-align:center;font-size:1.5rem;margin:.8rem 0 0">${tot?Math.round((S.dist[rev.g]||0)/tot*100):0}% da turma acertou</p><div class="ex">${esc(rev.e)}<code>${esc(rev.w)}</code></div><div style="margin-top:1rem">${ranking()}</div>`}
 $("m").innerHTML=h;
 $("go").textContent=goLabel(f,st)}
setInterval(()=>{const s=S.st,x=s.fimEm?Math.max(0,(s.fimEm-(Date.now()+off))/1000):0,r=s.fimEm?Math.ceil(x):"",t=$("tm");
 t.textContent=r;t.style.visibility=s.fimEm?"visible":"hidden";t.className=s.fimEm&&r<=5?"u":"";t.style.setProperty("--p",(s.fimEm&&s.dur?Math.min(100,x/s.dur*100):0)+"%");
 if(s.fase==="final"&&r!==""&&r!==lr&&r>0)tone(r<=5?1000:700,.07,"square",.1);lr=r},250);
render();loadC();poll();
</script></body></html>
